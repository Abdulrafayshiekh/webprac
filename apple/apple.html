<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body{
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f7;
        }
        nav{
            background-color: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 0;
        }
        .nav-container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin: 0 auto;
            gap: 24px;
        }
        .logo{
            font-size: 24px;
            font-weight: bold;
        }
        .menu{
            display: flex;
            gap: 20px;
        }
        .menu a{
            text-decoration: none;
            color: #333;
            font-size: 16px;
            letter-spacing: 0.4px;
            padding: 16px 0;
        }
        .menu a:hover{
            color: #0071e3;
        }
        .buttons{
            display: flex;
            gap: 10px;
        }
        .buttons button{
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
            letter-spacing: 0.02em;
        }
        .buttons button:hover{
            transform: translateY(-1px);
        }
        .button-primary{
            background-color: #0071e3;
            color: #fff;
            box-shadow: 0 10px 20px rgba(0, 113, 227, 0.17);
        }
        .button-secondary{
            background-color: #111111;
            color: #fff;
            box-shadow: 0 10px 20px rgba(17, 17, 17, 0.15);
        }
    </style>
</head>
<body>
    <nav>
    <div class="nav-container">
        <div class="logo"> <i class="fa-brands fa-apple" style="color: rgb(208, 207, 212);"></i> </div>
        <div class="menu">
            <a href="#">Macbook</a>
            <a href="#">Iphone</a>
            <a href="#">Mac</a>
            <a href="#">Ipad</a>
            <a href="#">Support</a>
        </div>
        <div class="buttons">
            <button class="button-primary">Buy now</button>
            <button class="button-secondary">Log in</button>
        </div>
    </div>
</nav>
</body>
</html>
